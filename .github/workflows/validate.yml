name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validation des données
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Integrity : les JSON référencés par src doivent rester synchronisés avec les schémas
      - name: Lint JSON (parsing + doublons)
        run: node scripts/validate.mjs

      - name: Smoke test de l'API
        run: |
          node --input-type=module -e "
            import * as rp from './src/index.js';
            if (rp.getItems().length !== 166 && rp.getItems().length === 0) throw new Error('items vides');
            if (!rp.getTheme('dayz').exclusiveItems.length) throw new Error('theme dayz vide');
            console.log('API OK —', rp.getItems().length, 'items,', rp.getVehicles().length, 'véhicules');
          "

  typecheck:
    name: Types TS du package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck